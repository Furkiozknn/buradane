[project]
name = "buradane-backend"
version = "1.0.0"
description = "buradane API - Turkey-focused civic/public-space discovery backend (places, categories, geospatial search, community contributions)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.15.2",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "shapely>=2.0.6",
    "httpx>=0.27.0",
    # PyJWT, not python-jose. python-jose pulls in `ecdsa`, which carries an
    # unfixed high-severity advisory (Minerva timing attack on P-256,
    # GHSA-wj6h-64fc-37mp - no patched release exists). Nothing here signs
    # with ECDSA: jwt_algorithm is HS256 and the token is symmetric, so the
    # vulnerable code was pure transitive weight. PyJWT has no ecdsa
    # dependency and is actively maintained.
    "pyjwt>=2.10.1",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    # Already present transitively (starlette runs on it), declared because
    # app/main.py now imports it directly to bound the request thread pool.
    # An undeclared import works right up until the transitive path changes.
    "anyio>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
