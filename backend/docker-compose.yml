services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: buradane
      POSTGRES_PASSWORD: buradane
      POSTGRES_DB: buradane
    ports:
      - "5432:5432"
    volumes:
      - buradane_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buradane -d buradane"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buradane_db_data:
