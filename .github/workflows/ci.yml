name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: buradane
          POSTGRES_PASSWORD: buradane
          POSTGRES_DB: buradane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buradane -d buradane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BURADANE_DATABASE_URL: postgresql+psycopg://buradane:buradane@localhost:5432/buradane

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v
