name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: buradane
          POSTGRES_PASSWORD: buradane
          POSTGRES_DB: buradane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buradane -d buradane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BURADANE_DATABASE_URL: postgresql+psycopg://buradane:buradane@localhost:5432/buradane

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Plain sync: pyproject defines dependency-groups (dev), not extras,
        # and uv installs groups by default - --all-extras was a no-op here.
        run: uv sync

      - name: Run tests
        # pipefail matters: GitHub's default bash does not set it, so
        # without it a pytest failure would be masked by tee's exit 0.
        run: |
          set -o pipefail
          uv run pytest tests/ -v -ra | tee pytest-output.txt

      - name: Fail on skipped tests
        # The trap this closes actually happened: the DB-availability probe
        # broke, every database test skipped, and CI stayed green while the
        # suite it exists to run never ran. In CI the Postgres service is
        # always there, so ANY skip means the harness is lying - fail loudly
        # instead. (A future legitimately-skipping test must make this
        # allowlist explicit, not delete the check.)
        run: |
          if grep -E "^SKIPPED|[0-9]+ skipped" pytest-output.txt; then
            echo "::error::Backend tests were SKIPPED in CI - the database suite did not actually run."
            exit 1
          fi
